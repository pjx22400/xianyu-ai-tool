<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲鱼 AI 助手</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
  .header{background:#1e293b;border-bottom:1px solid #334155;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
  .header h1{font-size:18px;color:#38bdf8}
  .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
  .status-dot.on{background:#22c55e;box-shadow:0 0 6px #22c55e}
  .status-dot.off{background:#ef4444}
  .tabs{display:flex;gap:0;background:#1e293b;border-bottom:1px solid #334155;padding:0 24px}
  .tab{padding:12px 20px;cursor:pointer;color:#64748b;font-size:14px;font-weight:600;border-bottom:2px solid transparent;transition:.2s}
  .tab:hover{color:#94a3b8}
  .tab.active{color:#38bdf8;border-bottom-color:#38bdf8}
  .container{max-width:1200px;margin:0 auto;padding:24px}
  .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;margin-bottom:20px}
  .card h2{font-size:16px;margin-bottom:16px;color:#94a3b8}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
  .stat-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;text-align:center}
  .stat-card .value{font-size:28px;font-weight:700}
  .stat-card .label{font-size:12px;color:#64748b;margin-top:4px}
  .green{color:#22c55e}.blue{color:#38bdf8}.yellow{color:#f59e0b}
  input,button{border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;padding:10px 14px;font-size:14px}
  input:focus{outline:none;border-color:#38bdf8}
  button{background:#1d4ed8;border:none;cursor:pointer;font-weight:600}
  button:hover{background:#2563eb}
  button.red{background:#991b1b}button.red:hover{background:#b91c1c}
  button.gray{background:#334155}button.gray:hover{background:#475569}
  button.green{background:#15803d}button.green:hover{background:#16a34a}
  .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .input-group{display:flex;gap:8px}
  .input-group input{flex:1}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:8px 12px;color:#64748b;font-weight:600;font-size:12px;border-bottom:1px solid #334155}
  td{padding:10px 12px;border-bottom:1px solid #1e293b;font-size:13px}
  tr:hover td{background:#1e293b}
  .tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600}
  .tag.new{background:#065f46;color:#6ee7b7}
  .tag.dropped{background:#7c2d12;color:#fca5a5}
  .item-img{width:50px;height:50px;object-fit:cover;border-radius:6px;background:#334155}
  .price-old{text-decoration:line-through;color:#64748b;margin-right:4px;font-size:12px}
  .price-drop{color:#f87171;font-size:12px}
  .chat-msg{padding:8px 12px;border-radius:8px;margin:4px 0;max-width:80%;font-size:13px;line-height:1.5}
  .chat-msg.in{background:#1e3a5f;align-self:flex-start;margin-right:auto}
  .chat-msg.out{background:#0f4a2e;align-self:flex-end;margin-left:auto}
  .chat-container{max-height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .loading{text-align:center;padding:40px;color:#64748b}
  .empty{text-align:center;padding:40px;color:#475569}
  .toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-size:14px;z-index:999;animation:fadeIn .3s}
  .toast.success{background:#065f46}.toast.error{background:#7c2d12}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .hidden{display:none}
</style>
</head>
<body>
<div class="header">
  <h1>🐟 闲鱼 AI 助手 v0.2</h1>
  <span id="status-bar" style="font-size:13px;color:#94a3b8">加载中...</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('monitor')">🔍 商品监控</div>
  <div class="tab" onclick="switchTab('cs')">💬 智能客服</div>
</div>

<div class="container">

<!-- ==================== 监控 Tab ==================== -->
<div id="tab-monitor">

<div class="stats">
  <div class="stat-card"><div class="value blue" id="s-kw">0</div><div class="label">监控关键词</div></div>
  <div class="stat-card"><div class="value green" id="s-items">0</div><div class="label">已采集商品</div></div>
</div>

<div class="card">
  <h2>🔍 添加监控关键词</h2>
  <div class="input-group" style="max-width:500px">
    <input id="kw-input" placeholder="搜索关键词，如 iPhone 15" />
    <button onclick="addKeyword()">添加</button>
    <button class="gray" onclick="triggerScan()">立即扫描</button>
  </div>
</div>

<div class="card">
  <h2>📋 监控列表</h2>
  <div id="kw-list"><div class="loading">加载中...</div></div>
</div>

<div class="card">
  <h2>📦 商品列表</h2>
  <div id="item-list"><div class="empty">选择关键词查看商品</div></div>
</div>
</div>

<!-- ==================== 客服 Tab ==================== -->
<div id="tab-cs" class="hidden">

<div class="stats">
  <div class="stat-card"><div class="value blue" id="cs-msgs">0</div><div class="label">今日消息</div></div>
</div>

<div class="card">
  <h2>💬 客服控制</h2>
  <div class="flex">
    <button class="green" id="btn-cs-start" onclick="csStart()">▶ 启动客服</button>
    <button class="red" id="btn-cs-stop" onclick="csStop()">⏹ 停止</button>
    <span id="cs-status-text" style="font-size:14px;color:#64748b">未启动</span>
  </div>
</div>

<div class="card">
  <h2>📩 消息记录</h2>
  <div class="chat-container" id="chat-log"><div class="empty">启动客服后这里会显示实时消息</div></div>
</div>
</div>

</div>

<div id="toast-container"></div>

<script>
const API='';
let currentTab='monitor';
let csPollTimer=null;

function toast(m,t='success'){
  const e=document.createElement('div');e.className=`toast ${t}`;e.textContent=m;
  document.getElementById('toast-container').appendChild(e);setTimeout(()=>e.remove(),3000);
}
async function api(url,o={}){
  try{const r=await fetch(API+url,{headers:{'Content-Type':'application/json'},...o});
  if(!r.ok)throw new Error(await r.text());return await r.json();}
  catch(e){toast(e.message,'error');throw e;}
}
function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&t==='monitor')||(i===1&&t==='cs')));
  document.getElementById('tab-monitor').classList.toggle('hidden',t!=='monitor');
  document.getElementById('tab-cs').classList.toggle('hidden',t!=='cs');
  if(t==='monitor'){loadStatus();loadKeywords();}
  if(t==='cs'){csLoadStatus();csLoadMessages();csPollTimer=setInterval(()=>{csLoadStatus();csLoadMessages();},5000);}
  else{if(csPollTimer){clearInterval(csPollTimer);csPollTimer=null;}}
}

// ==================== 监控 ====================
async function loadStatus(){
  try{const d=await api('/api/status');
    document.getElementById('s-kw').textContent=d.keywords?.length||0;
    document.getElementById('s-items').textContent=d.keywords?.reduce((s,k)=>s+(k.item_count||0),0)||0;
    document.getElementById('status-bar').innerHTML=`<span class="status-dot ${d.monitor_running?'on':'off'}"></span> 监控${d.monitor_running?'运行中':'未运行'} | 客服${d.cs_running?'运行中':'未启动'}`;
  }catch(e){}
}
async function loadKeywords(){
  try{const d=await api('/api/keywords');const el=document.getElementById('kw-list');
    if(!d.length){el.innerHTML='<div class="empty">还没有关键词，在上方添加</div>';return;}
    el.innerHTML=`<table><thead><tr><th>关键词</th><th>状态</th><th>操作</th></tr></thead><tbody>${d.map(k=>`
      <tr><td><a href="#" onclick="loadItems('${k.keyword}');return false" style="color:#38bdf8;text-decoration:none">${k.keyword}</a></td>
      <td>${k.enabled?'✅':'⏸'}</td>
      <td class="flex"><button class="gray" style="padding:4px 8px;font-size:12px" onclick="toggleKW('${k.keyword}',${!k.enabled})">${k.enabled?'暂停':'启用'}</button>
      <button class="red" style="padding:4px 8px;font-size:12px" onclick="deleteKW('${k.keyword}')">删除</button></td></tr>`).join('')}</tbody></table>`;
  }catch(e){}
}
async function addKeyword(){
  const kw=document.getElementById('kw-input').value.trim();if(!kw)return;
  await api('/api/keywords',{method:'POST',body:JSON.stringify({keyword:kw})});
  document.getElementById('kw-input').value='';toast(`已添加: ${kw}`);loadKeywords();loadStatus();
}
async function deleteKW(k){if(!confirm(`删除 "${k}"？`))return;await api(`/api/keywords/${encodeURIComponent(k)}`,{method:'DELETE'});toast('已删除');loadKeywords();}
async function toggleKW(k,e){await api(`/api/keywords/${encodeURIComponent(k)}/toggle?enabled=${e}`,{method:'PUT'});toast(`${k} ${e?'启用':'暂停'}`);loadKeywords();}
async function triggerScan(){toast('扫描中...');await api('/api/scan',{method:'POST'});toast('扫描完成');loadKeywords();}
async function loadItems(kw){
  const el=document.getElementById('item-list');
  try{const d=await api(`/api/items?keyword=${encodeURIComponent(kw)}&limit=30`);
    if(!d.length){el.innerHTML='<div class="empty">暂无数据，点「立即扫描」</div>';return;}
    el.innerHTML=`<table><thead><tr><th></th><th>标题</th><th>价格</th><th>卖家</th><th>状态</th></tr></thead><tbody>${d.map(it=>`
      <tr><td>${it.image_url?`<img class="item-img" src="${it.image_url}" loading="lazy" onerror="this.style.display='none'">`:''}</td>
      <td><a href="${it.item_url}" target="_blank" style="color:#e2e8f0;text-decoration:none">${(it.title||'').substring(0,45)}</a></td>
      <td>${it.price_dropped?`<span class="price-old">¥${it.old_price}</span>`:''}¥${it.price}${it.price_dropped?`<span class="price-drop">-¥${it.price_drop_amount}</span>`:''}</td>
      <td>${it.seller||'?'}</td>
      <td>${it.is_new?'<span class="tag new">新品</span>':it.price_dropped?'<span class="tag dropped">降价</span>':''}</td></tr>`).join('')}</tbody></table>`;
  }catch(e){}
}

// ==================== 智能客服 ====================
async function csLoadStatus(){
  try{const d=await api('/api/cs/status');
    document.getElementById('cs-msgs').textContent=d.message_count||0;
    document.getElementById('cs-status-text').textContent=d.running?'运行中':'未启动';
    document.getElementById('btn-cs-start').disabled=d.running;
    document.getElementById('btn-cs-stop').disabled=!d.running;
    document.getElementById('status-bar').innerHTML=d.running
      ?'<span class="status-dot on"></span> 监控运行中 | <span class="status-dot on"></span> 客服运行中'
      :'<span class="status-dot on"></span> 监控运行中 | <span class="status-dot off"></span> 客服未启动';
  }catch(e){}
}
async function csLoadMessages(){
  try{const d=await api('/api/cs/messages?limit=50');const el=document.getElementById('chat-log');
    if(!d.length){el.innerHTML='<div class="empty">暂无消息</div>';return;}
    el.innerHTML=d.map(m=>`<div class="chat-msg ${m.direction}"><strong>${m.sender_name}</strong><br>${m.content}</div>`).join('');
    el.scrollTop=el.scrollHeight;
  }catch(e){}
}
async function csStart(){await api('/api/cs/start',{method:'POST'});toast('客服已启动');csLoadStatus();}
async function csStop(){await api('/api/cs/stop',{method:'POST'});toast('客服已停止');csLoadStatus();}

// 初始化
loadStatus();loadKeywords();
</script>
</body>
</html>
