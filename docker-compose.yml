# 闲鱼 AI 助手 — Docker Compose 编排
version: "3.8"

services:
  xianyu-ai:
    build: .
    container_name: xianyu-ai-tool
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 持久化：数据库 + 日志 + 配置
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      # 通知队列：notifier 写入文件 → 宿主机 cron 轮询推送飞书
      - ./notifications:/app/notifications
      # 开发模式：前端挂载热更新
      - ./frontend:/app/frontend:ro
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
